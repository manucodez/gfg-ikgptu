<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — GFG IKGPTU</title>
    <meta name="theme-color" content="#1F8A4C" />
    <style>
      /* Plain inline CSS on purpose: this file is served as a static
         fallback by the service worker when there is no network, so it
         can't depend on Tailwind's compiled output, webfonts, or any
         other network request — it has to render from cache alone. The
         colors below are copied from tailwind.config.ts (brand/paper/ink)
         so it still looks like the rest of the site. */
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        background: #f7f9f7;
        color: #0d1210;
        font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1713;
          color: rgba(255, 255, 255, 0.9);
        }
        .card {
          background: #152019 !important;
          border-color: rgba(255, 255, 255, 0.1) !important;
        }
        .btn {
          color: #0f1713 !important;
        }
      }
      .card {
        max-width: 26rem;
        width: 100%;
        background: #ffffff;
        border: 1px solid rgba(13, 18, 16, 0.1);
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 2px 8px rgba(13, 18, 16, 0.06), 0 16px 40px -12px rgba(13, 18, 16, 0.14);
      }
      .logo {
        width: 64px;
        height: auto;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-size: 1.375rem;
        line-height: 1.3;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #5b6560;
        line-height: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        p {
          color: rgba(255, 255, 255, 0.6);
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.65rem 1.5rem;
        border-radius: 0.75rem;
        background: #1f8a4c;
        color: #ffffff;
        font-weight: 600;
        font-size: 0.9375rem;
        text-decoration: none;
        border: none;
        cursor: pointer;
      }
      .btn:hover {
        background: #146a38;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/brand/logo-mark.png" alt="GFG IKGPTU" />
      <h1>You're offline</h1>
      <p>
        This page needs a connection and hasn't been saved for offline
        viewing yet. Reconnect and try again.
      </p>
      <button class="btn" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
